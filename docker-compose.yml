services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sahyog
      POSTGRES_USER: sahyog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahyog -d sahyog"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sahyog:${POSTGRES_PASSWORD}@postgres:5432/sahyog
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SAHYOG_SERVICE_TOKEN: ${SAHYOG_SERVICE_TOKEN:?Set SAHYOG_SERVICE_TOKEN in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: http://localhost:5173
      SAHYOG_URL: http://mock-sahyog:8001
      UPLOAD_DIR: /workspace/data/uploads
    volumes:
      - uploads:/workspace/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-sahyog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  mock-sahyog:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "mock_services.sahyog.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SAHYOG_SERVICE_TOKEN: ${SAHYOG_SERVICE_TOKEN:?Set SAHYOG_SERVICE_TOKEN in .env}
      MOCK_DATABASE_URL: sqlite:////workspace/data/mock/portal.db
      BACKEND_URL: http://backend:8000
    volumes:
      - mock_data:/workspace/data/mock
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
  mock_data:
